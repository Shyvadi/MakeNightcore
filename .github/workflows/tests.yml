name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported setup: ffmpeg 4.4 and Rubber Band 2.0.
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.x" }
          # Homebrew's ffmpeg has no SoX resampler, Vorbis or rubberband filter.
          - { os: macos-latest, python: "3.x" }
          # Uses the Rubber Band bundled in this repository.
          - { os: windows-latest, python: "3.x" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg and Rubber Band (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg rubberband-cli

      - name: Install ffmpeg and Rubber Band (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg rubberband

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: python -m pip install pytest

      - run: python -m pytest -v
